openapi: 3.0.3
info:
  title: Document Vault API
  description: Production-grade REST API for uploading, listing, streaming, and managing text, markdown, and JSON documents with MongoDB Atlas metadata persistence and AWS S3 / Cloudflare R2 cloud object storage.
  version: 1.0.0
  contact:
    name: Document Vault Engineering Team
servers:
  - url: /api
    description: Current Base API Server

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns service status, uptime, database connectivity, and cloud storage provider status.
      tags:
        - System
      responses:
        '200':
          description: Service and database are healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service degraded (e.g. database disconnected).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /documents:
    post:
      summary: Upload a new document to Cloud Object Storage
      description: Uploads a single document file (.txt, .md, or .json) up to 5MB. Validates in-memory text encoding and JSON syntax before persisting metadata to MongoDB Atlas and streaming the file directly to an AWS S3 / Cloudflare R2 bucket using unique UUID-based keys.
      tags:
        - Documents
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The document file to upload (.txt, .md, or .json). Max size 5MB.
      responses:
        '201':
          description: Document uploaded and persisted to cloud storage successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSuccessResponse'
        '400':
          description: Invalid upload request (missing file, empty file, non-UTF8 content, or malformed JSON).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Upload exceeds configured maximum file size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type (only .txt, .md, and .json permitted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Cloud storage or database failure with safe rollback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: List all documents
      description: Retrieves metadata for all ready documents from MongoDB, sorted in descending order (newest first).
      tags:
        - Documents
      responses:
        '200':
          description: List of documents retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
        '500':
          description: Database retrieval error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents/{id}/download:
    get:
      summary: Download document file or get pre-signed URL
      description: Streams the document file directly from Cloud Object Storage with original filename in the Content-Disposition header. If ?presigned=true query parameter is supplied, returns an ephemeral pre-signed download URL.
      tags:
        - Documents
      parameters:
        - name: id
          in: path
          required: true
          description: MongoDB ObjectId of the document.
          schema:
            type: string
            example: "67215c0e189a022567df48ab"
        - name: presigned
          in: query
          required: false
          description: If true, returns an ephemeral pre-signed S3 download URL as JSON instead of streaming.
          schema:
            type: boolean
            example: false
      responses:
        '200':
          description: File stream returned as binary attachment or JSON containing presigned URL.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="report.json"
            Content-Type:
              schema:
                type: string
                example: application/json
            X-Presigned-Url:
              schema:
                type: string
                description: Ephemeral pre-signed S3 download URL.
          content:
            text/plain:
              schema:
                type: string
                format: binary
            text/markdown:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                oneOf:
                  - type: string
                    format: binary
                  - type: object
                    properties:
                      downloadUrl:
                        type: string
                        example: "https://bucket.s3.amazonaws.com/documents/uuid.json?X-Amz-Signature=..."
        '400':
          description: Malformed MongoDB identifier format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Document metadata not found or physical file missing in cloud storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents/{id}/preview:
    get:
      summary: Preview document content from S3
      description: Streams UTF-8 text contents directly from Cloud Object Storage for in-browser modal inspection.
      tags:
        - Documents
      parameters:
        - name: id
          in: path
          required: true
          description: MongoDB ObjectId of the document.
          schema:
            type: string
      responses:
        '200':
          description: Document metadata and decoded content string.
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/PublicDocument'
                  content:
                    type: string
                    example: "# Project Overview\n\nAll tasks completed."
        '400':
          description: Invalid document ID format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Document not found in database or cloud storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents/{id}:
    delete:
      summary: Delete a document from S3 and MongoDB
      description: Executes a two-phase deletion. Marks document as deleting in MongoDB, executes DeleteObjectCommand on the S3 bucket to wipe the object, and cleans up the MongoDB metadata record.
      tags:
        - Documents
      parameters:
        - name: id
          in: path
          required: true
          description: MongoDB ObjectId of the document.
          schema:
            type: string
      responses:
        '200':
          description: Document and cloud object deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Document deleted successfully
                  id:
                    type: string
                    example: "67215c0e189a022567df48ab"
                  originalName:
                    type: string
                    example: "notes.txt"
        '400':
          description: Malformed MongoDB identifier format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Document not found or already deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    PublicDocument:
      type: object
      properties:
        _id:
          type: string
          example: "67215c0e189a022567df48ab"
        originalName:
          type: string
          example: "project-spec.md"
        extension:
          type: string
          enum: [".txt", ".md", ".json"]
          example: ".md"
        mimeType:
          type: string
          enum: ["text/plain", "text/markdown", "application/json"]
          example: "text/markdown"
        size:
          type: integer
          description: File size in bytes.
          example: 4096
        bucket:
          type: string
          example: "document-vault-bucket"
        region:
          type: string
          example: "us-east-1"
        status:
          type: string
          enum: ["ready", "deleting"]
          example: "ready"
        createdAt:
          type: string
          format: date-time
          example: "2026-10-29T08:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-29T08:30:00.000Z"

    UploadSuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: "Document uploaded successfully"
        document:
          $ref: '#/components/schemas/PublicDocument'

    DocumentListResponse:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/PublicDocument'

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "healthy"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-29T09:00:00.000Z"
        database:
          type: string
          example: "connected"
        storageProvider:
          type: string
          example: "s3"
        uptime:
          type: number
          example: 124.5

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "MALFORMED_JSON"
            message:
              type: string
              example: "The uploaded JSON file contains syntax errors: Unexpected token } in JSON at position 12"
