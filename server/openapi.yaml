openapi: 3.0.3
info:
  title: Document Vault API
  description: Production-grade REST API for user authentication (JWT + bcrypt), uploading, listing, streaming, and managing text, markdown, and JSON documents with MongoDB Atlas metadata persistence and AWS S3 / Cloudflare R2 cloud object storage.
  version: 2.0.0
  contact:
    name: Document Vault Engineering Team
servers:
  - url: /api
    description: Current Base API Server

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns service status, uptime, database connectivity, and cloud storage provider status.
      tags:
        - System
      responses:
        '200':
          description: Service and database are healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service degraded (e.g. database disconnected).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/signup:
    post:
      summary: Register a new user
      description: Validates email format and password strength (min 6 characters), hashes the password with bcrypt, creates the user in MongoDB, and returns a signed JWT token.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "alice@example.com"
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: "secret123"
      responses:
        '201':
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          description: Missing fields, invalid email format, or weak password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Authenticate user credentials
      description: Compares provided credentials against stored bcrypt password hashes and returns a signed JWT token on success.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "alice@example.com"
                password:
                  type: string
                  format: password
                  example: "secret123"
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          description: Missing email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      summary: Get current authenticated user profile
      description: Verifies Bearer JWT token and returns the current user profile.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/PublicUser'
        '401':
          description: Missing, invalid, or expired JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents:
    post:
      summary: Upload a new document to Cloud Object Storage
      description: Uploads a single document file (.txt, .md, or .json) up to 5MB. Scoped to the authenticated user. Validates in-memory text encoding and JSON syntax before persisting metadata to MongoDB Atlas and streaming the file directly to an AWS S3 / Cloudflare R2 bucket.
      tags:
        - Documents
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The document file to upload (.txt, .md, or .json). Max size 5MB.
      responses:
        '201':
          description: Document uploaded and persisted to cloud storage successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSuccessResponse'
        '400':
          description: Invalid upload request (missing file, empty file, non-UTF8 content, or malformed JSON).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. Valid Bearer token required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Upload exceeds configured maximum file size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type (only .txt, .md, and .json permitted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: List all documents
      description: Retrieves metadata for all ready documents belonging to the authenticated user from MongoDB, sorted in descending order (newest first).
      tags:
        - Documents
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of documents retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
        '401':
          description: Unauthorized. Valid Bearer token required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents/{id}/download:
    get:
      summary: Download document file or get pre-signed URL
      description: Streams the document file directly from Cloud Object Storage with original filename in the Content-Disposition header. Only accessible by the document owner.
      tags:
        - Documents
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: MongoDB ObjectId of the document.
          schema:
            type: string
        - name: presigned
          in: query
          required: false
          description: If true, returns an ephemeral pre-signed S3 download URL as JSON instead of streaming.
          schema:
            type: boolean
      responses:
        '200':
          description: File stream returned as binary attachment or JSON containing presigned URL.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Document metadata not found or user lacks ownership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents/{id}/preview:
    get:
      summary: Preview document content from S3
      description: Streams UTF-8 text contents directly from Cloud Object Storage for in-browser modal inspection. Only accessible by the document owner.
      tags:
        - Documents
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: MongoDB ObjectId of the document.
          schema:
            type: string
      responses:
        '200':
          description: Document metadata and decoded content string.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Document not found or unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents/{id}:
    delete:
      summary: Delete a document from S3 and MongoDB
      description: Executes a two-phase deletion. Marks document as deleting, deletes S3 object, and removes MongoDB record. Only accessible by the document owner.
      tags:
        - Documents
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: MongoDB ObjectId of the document.
          schema:
            type: string
      responses:
        '200':
          description: Document and cloud object deleted successfully.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Document not found or already deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your signed JWT token obtained from /api/auth/signup or /api/auth/login.

  schemas:
    PublicUser:
      type: object
      properties:
        id:
          type: string
          example: "67215c0e189a022567df48ab"
        email:
          type: string
          example: "alice@example.com"
        createdAt:
          type: string
          format: date-time

    AuthSuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: "Login successful"
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: '#/components/schemas/PublicUser'

    PublicDocument:
      type: object
      properties:
        _id:
          type: string
          example: "67215c0e189a022567df48ab"
        userId:
          type: string
          example: "67215c0e189a022567df4800"
        originalName:
          type: string
          example: "project-spec.md"
        extension:
          type: string
          enum: [".txt", ".md", ".json"]
          example: ".md"
        mimeType:
          type: string
          enum: ["text/plain", "text/markdown", "application/json"]
          example: "text/markdown"
        size:
          type: integer
          example: 4096
        bucket:
          type: string
          example: "document-vault-bucket"
        region:
          type: string
          example: "us-east-1"
        status:
          type: string
          enum: ["ready", "deleting"]
          example: "ready"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UploadSuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: "Document uploaded successfully"
        document:
          $ref: '#/components/schemas/PublicDocument'

    DocumentListResponse:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/PublicDocument'

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "healthy"
        timestamp:
          type: string
          format: date-time
        database:
          type: string
          example: "connected"
        storageProvider:
          type: string
          example: "s3"
        uptime:
          type: number
          example: 124.5

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "UNAUTHORIZED"
            message:
              type: string
              example: "Authentication required. Please provide a valid Bearer token."
